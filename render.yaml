services:
  # Backend Service (FastAPI)
  - type: web
    name: vajra-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: vajra-database
          property: connectionString
    healthCheckPath: /health

  # Frontend Service (Next.js Static Export)
  - type: web
    name: vajra-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve out -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: https://vajra-backend.onrender.com
    healthCheckPath: /

# PostgreSQL Database Service (Free for 90 days, then paid)
databases:
  - name: vajra-database
    databaseName: vajra
    user: vajra_user
