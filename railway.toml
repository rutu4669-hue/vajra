[build]
builder = "NIXPACKS"

[build.env]
PYTHON_VERSION = "3.11"
NODE_VERSION = "20"

[[services]]
name = "vajra-backend"
command = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
env = [
  "DATABASE_URL=postgresql://neondb_owner:npg_WzCOhSJ0dn6f@ep-nameless-bird-ay266zed.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require",
  "PORT=8000"
]
healthcheck_path = "/health"

[[services]]
name = "vajra-frontend"
command = "cd frontend && npx serve out -l $PORT"
env = [
  "NEXT_PUBLIC_API_URL=https://vajra-backend.onrailway.app"
]
healthcheck_path = "/"
